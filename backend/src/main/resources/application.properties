spring.application.name=backend
server.port=${SERVER_PORT:8080}

# H2 Database Configurations
spring.datasource.url=jdbc:h2:file:./data/pharmacy_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Actuator — expose health endpoint for Electron readiness checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging levels (suppress spam, show info)
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

# File logging (can be overridden via --logging.file.path CLI arg from Electron)
logging.file.name=${BACKEND_LOG_FILE:}
